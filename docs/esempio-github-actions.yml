name: Scraping recensioni Booking

on:
  schedule:
    - cron: "17 5 * * *"     # ogni giorno alle 05:17 UTC (06:17 in Italia d'inverno, 07:17 d'estate)
  workflow_dispatch:          # pulsante "Run workflow" per lanciarlo a mano

jobs:
  scraping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installa librerie
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Raccogli recensioni nuove
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HEADLESS: "1"
        run: python booking_reviews.py
